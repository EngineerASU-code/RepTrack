name = "reptrack-telegram-relay"
main = "src/index.mjs"
compatibility_date = "2026-11-14"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "reptrack-telegram-relay"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[env.staging]
name = "reptrack-telegram-relay-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "reptrack-telegram-relay-staging"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"
