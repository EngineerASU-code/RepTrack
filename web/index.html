<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#100d18" />
    <title>RepTrack — твой прогресс</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #100d18;
        --surface: #1d1928;
        --raised: #292337;
        --line: #383147;
        --accent: #a779ff;
        --accent2: #7441da;
        --text: #f6f3fc;
        --muted: #a9a2b6;
        --good: #b8ff48;
        --red: #ff8794;
        font:
          15px/1.45 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(ellipse at 88% 0%, #321c582a, transparent 34rem),
          var(--bg);
        color: var(--text);
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      #app {
        max-width: 1120px;
        margin: auto;
        padding: 28px 26px 100px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 34px;
      }
      .brand {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .brand i {
        color: var(--accent);
        font-style: normal;
      }
      .topright {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .pill,
      .iconbtn {
        border: 1px solid var(--line);
        background: #ffffff08;
        border-radius: 14px;
        padding: 10px 14px;
      }
      .pill {
        color: var(--muted);
        font-size: 13px;
      }
      .iconbtn {
        font-size: 18px;
      }
      .layout {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 34px;
      }
      .nav {
        position: sticky;
        top: 20px;
        align-self: start;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .nav button {
        border: 0;
        background: none;
        text-align: left;
        padding: 13px 16px;
        border-radius: 14px;
        color: var(--muted);
      }
      .nav button.active {
        background: #a779ff20;
        color: #d8c5ff;
        font-weight: 700;
      }
      .nav small {
        margin: 22px 12px 6px;
        color: #716a80;
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 1.5px;
      }
      .content {
        min-width: 0;
      }
      .heading {
        margin: 0;
        font-size: 32px;
        letter-spacing: -1px;
      }
      .sub {
        margin: 4px 0 22px;
        color: var(--muted);
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: linear-gradient(145deg, #252032, #1b1824);
        padding: 21px;
        margin-bottom: 16px;
      }
      .hero {
        padding: 28px;
        background:
          radial-gradient(circle at 86% 15%, #9257ff35, transparent 27%),
          linear-gradient(140deg, #2a203c, #1c1826 70%);
        border-color: #55446f;
      }
      .eyebrow {
        font-size: 12px;
        color: #c4a9ff;
        letter-spacing: 0.5px;
      }
      .hero h2 {
        font-size: 34px;
        margin: 8px 0 3px;
      }
      .muted {
        color: var(--muted);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      .button {
        border: 0;
        border-radius: 14px;
        background: linear-gradient(100deg, #b078ff, #8350e9);
        color: #170d25;
        padding: 13px 18px;
        font-weight: 750;
      }
      .button.secondary {
        background: #ffffff0b;
        color: var(--text);
        border: 1px solid var(--line);
      }
      .button.wide {
        width: 100%;
        margin-top: 20px;
      }
      .cycle {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
      }
      .day {
        padding: 8px 12px;
        background: #ffffff08;
        border: 1px solid var(--line);
        border-radius: 11px;
        color: var(--muted);
      }
      .day.current {
        border-color: var(--accent);
        color: #e6d8ff;
        background: #a779ff20;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .stat {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 15px;
        background: #ffffff06;
      }
      .stat b {
        display: block;
        font-size: 21px;
        margin-top: 4px;
      }
      .sectiontitle {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 14px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .tab {
        border: 1px solid var(--line);
        background: #ffffff08;
        border-radius: 999px;
        padding: 9px 15px;
        color: var(--muted);
      }
      .tab.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #1b1028;
        font-weight: 700;
      }
      .exercise {
        padding: 0;
        overflow: hidden;
      }
      .exercise summary {
        padding: 17px 19px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
        list-style: none;
      }
      .exercise summary:after {
        content: "⌄";
        float: right;
        color: var(--muted);
      }
      details[open] summary:after {
        content: "⌃";
      }
      .exercise-body {
        padding: 0 18px 16px;
      }
      .prev {
        font-size: 12px;
        color: var(--muted);
        padding: 10px 12px;
        background: #ffffff07;
        border-radius: 11px;
        margin-bottom: 12px;
      }
      .sethead,
      .set {
        display: grid;
        grid-template-columns: 36px 1fr 1fr 42px;
        gap: 8px;
        align-items: center;
        text-align: center;
      }
      .sethead {
        color: var(--muted);
        font-size: 11px;
        padding: 5px;
      }
      .set {
        margin-top: 7px;
      }
      .set input {
        width: 100%;
        min-width: 0;
        background: #ffffff0b;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px;
        color: var(--text);
        text-align: center;
      }
      .check {
        border: 1px solid #686078;
        background: transparent;
        border-radius: 9px;
        width: 32px;
        height: 32px;
      }
      .check.done {
        background: var(--accent);
        border-color: var(--accent);
        color: #1b1028;
        font-weight: 900;
      }
      .smallbtn {
        background: none;
        border: 0;
        color: #c5a9ff;
        padding: 10px 2px 0;
        font-size: 13px;
      }
      .bar {
        height: 8px;
        background: #ffffff15;
        border-radius: 8px;
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #8054dd, #c398ff);
        border-radius: 8px;
        transition: width 0.2s;
      }
      .chart {
        width: 100%;
        height: 210px;
        display: block;
      }
      .exercise-list {
        display: grid;
        gap: 9px;
      }
      .listrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        background: #ffffff06;
        border: 1px solid var(--line);
        border-radius: 13px;
      }
      .badge {
        font-size: 11px;
        color: #c8aaff;
        background: #a779ff1b;
        padding: 5px 8px;
        border-radius: 8px;
      }
      .empty {
        padding: 34px;
        text-align: center;
        color: var(--muted);
      }
      .foot {
        color: #777084;
        font-size: 12px;
        margin-top: 25px;
      }
      @media (max-width: 760px) {
        #app {
          padding: 17px 15px 90px;
        }
        .layout {
          display: block;
        }
        .nav {
          position: fixed;
          z-index: 5;
          bottom: 0;
          left: 0;
          right: 0;
          top: auto;
          display: flex;
          flex-direction: row;
          justify-content: space-around;
          background: #17131feb;
          backdrop-filter: blur(18px);
          border-top: 1px solid var(--line);
          padding: 7px 4px calc(7px + env(safe-area-inset-bottom));
          gap: 0;
        }
        .nav button {
          font-size: 10px;
          text-align: center;
          padding: 9px 5px;
          flex: 1;
        }
        .nav button span {
          display: block;
          font-size: 18px;
        }
        .nav small {
          display: none;
        }
        .heading {
          font-size: 27px;
        }
        .hero h2 {
          font-size: 29px;
        }
        .stats {
          grid-template-columns: repeat(3, 1fr);
          gap: 7px;
        }
        .stat {
          padding: 11px 9px;
          font-size: 12px;
        }
        .stat b {
          font-size: 17px;
        }
        .cycle {
          overflow: auto;
        }
        .day {
          white-space: nowrap;
        }
        .top {
          margin-bottom: 24px;
        }
        .pill {
          display: none;
        }
      }
      /* Browser presentation: a live Android-sized app screen, not a desktop dashboard. */
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 12%, #372354 0, transparent 44rem),
          #08070c;
        padding: 18px;
      }
      #app {
        width: 100%;
        max-width: 440px;
        height: min(920px, calc(100svh - 36px));
        padding: 0;
        margin: 0;
      }
      .device {
        height: 100%;
        position: relative;
        overflow: hidden;
        border: 8px solid #27242c;
        border-radius: 42px;
        background: var(--bg);
        box-shadow:
          0 30px 100px #0009,
          0 0 0 1px #ffffff20;
        display: flex;
        flex-direction: column;
      }
      .statusbar {
        height: 34px;
        flex: none;
        padding: 8px 21px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.15px;
      }
      .status-icons {
        color: #ddd5e8;
        font-size: 11px;
        letter-spacing: 2px;
      }
      .top {
        height: 55px;
        flex: none;
        padding: 0 18px;
        margin: 0;
        border-bottom: 1px solid #ffffff0a;
      }
      .brand {
        font-size: 21px;
      }
      .topright {
        gap: 6px;
      }
      .pill {
        display: none;
      }
      .iconbtn {
        border: 0;
        background: transparent;
        padding: 8px 10px;
      }
      .layout {
        display: block;
        min-height: 0;
        flex: 1;
        overflow: hidden;
      }
      .content {
        height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 17px 16px 82px;
        scrollbar-width: thin;
        scrollbar-color: #514565 transparent;
      }
      .heading {
        font-size: 25px;
        letter-spacing: -0.6px;
      }
      .sub {
        font-size: 13px;
        margin: 3px 0 16px;
      }
      .card {
        padding: 17px;
        border-radius: 18px;
        margin-bottom: 12px;
      }
      .hero {
        padding: 21px;
      }
      .hero h2 {
        font-size: 30px;
      }
      .stats {
        gap: 7px;
      }
      .stat {
        padding: 10px 8px;
        font-size: 11px;
      }
      .stat b {
        font-size: 16px;
      }
      .nav {
        position: absolute;
        z-index: 5;
        left: 0;
        right: 0;
        bottom: 11px;
        height: 65px;
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        gap: 0;
        padding: 6px 5px 0;
        background: #1b1724f2;
        border-top: 1px solid #ffffff12;
        backdrop-filter: blur(18px);
      }
      .nav button {
        flex: 1;
        min-width: 0;
        padding: 3px 2px;
        border: 0;
        background: transparent;
        text-align: center;
        font-size: 10px;
        color: var(--muted);
        border-radius: 12px;
      }
      .nav button span {
        display: block;
        font-size: 18px;
        line-height: 22px;
      }
      .nav button.active {
        background: #a779ff20;
        color: #d8c5ff;
      }
      .nav small {
        display: none;
      }
      .android-home {
        height: 11px;
        width: 108px;
        flex: none;
        align-self: center;
        border-radius: 999px;
        background: #f1edf6;
        margin: 0 auto 3px;
      }
      @media (max-width: 520px) {
        body {
          display: block;
          padding: 0;
          background: var(--bg);
        }
        #app {
          max-width: none;
          height: 100svh;
        }
        .device {
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
        .statusbar {
          padding-top: max(8px, env(safe-area-inset-top));
        }
        .android-home {
          margin-bottom: max(3px, env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const initial = {
        cycle: ["Push", "Legs", "Pull", "Up"],
        templates: {
          Push: [
            "Жим угловой",
            "Хаммер низ груди",
            "Тяга к поясу",
            "Трицепс",
            "Плечи стоя, задняя дельта",
            "Бицепс Скотт (суперсет)",
          ],
          Legs: [
            "Разминка, ходьба в гору",
            "Жим ногами",
            "Сгибания ног",
            "Разгибания ног",
            "Подъём на носки стоя",
          ],
          Pull: [
            "Подтягивания / тяга",
            "Тяга нижнего блока",
            "Тяга спины Hammer",
            "Тяга на трицепс",
            "Молотки с гантелями",
            "Плечи Smith",
          ],
          Up: [
            "Жим груди в наклоне",
            "Smith дельта",
            "Разводка груди Butterfly",
            "Тяга верхнего блока",
            "Бицепс стоя со штангой",
            "Беговая дорожка",
          ],
        },
        sessions: [],
        active: null,
        tab: "Главная",
      };
      let db;
      try {
        db = JSON.parse(localStorage.repTrack || "null");
      } catch {}
      let state = db || structuredClone(initial);
      function save() {
        localStorage.repTrack = JSON.stringify(state);
      }
      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function current() {
        return state.cycle[0] || "Push";
      }
      function start() {
        if (!state.active)
          state.active = {
            name: current(),
            started: Date.now(),
            items: state.templates[current()].map((name) => ({
              name,
              sets: [
                { weight: "", reps: "", done: false },
                { weight: "", reps: "", done: false },
                { weight: "", reps: "", done: false },
              ],
            })),
          };
        save();
        render();
      }
      function finish() {
        if (!state.active) return;
        state.sessions.unshift({
          ...state.active,
          ended: Date.now(),
          date: new Date().toISOString(),
        });
        const i = state.cycle.indexOf(state.active.name);
        if (i >= 0)
          state.cycle =
            i < state.cycle.length - 1
              ? [...state.cycle.slice(i + 1), ...state.cycle.slice(0, i + 1)]
              : [...state.cycle];
        state.active = null;
        save();
        render();
      }
      function setsUI(ex, ei) {
        return `<div class="prev">◷ Прошлый раз · ${
          state.sessions
            .find((s) => s.name === current())
            ?.items.find((x) => x.name === ex.name)
            ?.sets.filter((s) => s.done)
            .map((s) => `${s.weight || 0}×${s.reps || 0}`)
            .join(" · ") || "пока нет записей"
        }</div><div class="sethead"><span>№</span><span>Вес, кг</span><span>Повторы</span><span>✓</span></div>${ex.sets.map((s, si) => `<div class="set"><span>${si + 1}</span><input aria-label="Вес" inputmode="decimal" placeholder="—" value="${esc(s.weight)}" onchange="edit(${ei},${si},'weight',this.value)"><input aria-label="Повторы" inputmode="numeric" placeholder="—" value="${esc(s.reps)}" onchange="edit(${ei},${si},'reps',this.value)"><button class="check ${s.done ? "done" : ""}" aria-label="Отметить подход" onclick="toggle(${ei},${si})">${s.done ? "✓" : ""}</button></div>`).join("")}<button class="smallbtn" onclick="addSet(${ei})">＋ Добавить подход</button>`;
      }
      function render() {
        const tab = state.tab,
          active = !!state.active,
          done =
            state.active?.items.flatMap((x) => x.sets).filter((s) => s.done)
              .length || 0,
          total = state.active?.items.flatMap((x) => x.sets).length || 0;
        let body = "";
        if (tab === "Главная")
          body = `<div class="card hero"><div class="eyebrow">✦ ${active ? "ТРЕНИРОВКА В ПРОЦЕССЕ" : "СЛЕДУЮЩАЯ ТРЕНИРОВКА"}</div><h2>${esc(active ? state.active.name : current())}</h2><div class="muted">${state.templates[active ? state.active.name : current()].length} упражнений · персональный тренировочный цикл</div>${active ? `<div style="margin-top:17px" class="bar"><span style="width:${total ? (done / total) * 100 : 0}%"></span></div><p class="muted">${done} из ${total} подходов</p>` : ""}<button class="button wide" onclick="${active ? "finish()" : "start()"}">${active ? "✓ Завершить тренировку" : "▶  Начать тренировку"}</button><div class="cycle">${state.cycle.map((d, i) => `<span class="day ${i === 0 ? "current" : ""}">${esc(d)}</span>${i < state.cycle.length - 1 ? '<span class="muted">›</span>' : ""}`).join("")}</div></div><div class="card"><div class="row"><h3 class="sectiontitle">Последняя сессия</h3><span class="muted">${state.sessions[0] ? new Date(state.sessions[0].date).toLocaleDateString("ru-RU") : "—"}</span></div>${state.sessions[0] ? `<div class="row"><b>${esc(state.sessions[0].name)}</b><span class="badge">Завершена</span></div><p class="muted">${state.sessions[0].items.length} упражнений · ${state.sessions[0].items.reduce((n, x) => n + x.sets.filter((s) => s.done).length, 0)} подходов · ${volume(state.sessions[0]).toLocaleString("ru-RU")} кг</p>` : '<div class="empty">Здесь появится первая тренировка</div>'}</div><div class="card"><h3 class="sectiontitle">Прогресс</h3><div class="stats"><div class="stat">Тренировок<b>${state.sessions.length}</b></div><div class="stat">Подходов<b>${state.sessions.reduce((n, s) => n + s.items.reduce((m, x) => m + x.sets.filter((y) => y.done).length, 0), 0)}</b></div><div class="stat">Тоннаж<b>${state.sessions.reduce((n, s) => n + volume(s), 0).toLocaleString("ru-RU")} кг</b></div></div></div>`;
        else if (tab === "Зал")
          body = `<div class="card"><div class="row"><div><h3 class="sectiontitle">${active ? "Текущая тренировка" : current()}</h3><div class="muted">Отмечай выполненные подходы, изменения сохраняются автоматически</div></div>${active ? '<button class="button" onclick="finish()">Завершить</button>' : '<button class="button" onclick="start()">Начать</button>'}</div>${active ? `<div class="bar" style="margin:18px 0 8px"><span style="width:${total ? (done / total) * 100 : 0}%"></span></div><p class="muted">${done} / ${total} подходов · ${Math.floor((Date.now() - state.active.started) / 60000)} мин</p>` : ""}</div>${(active
            ? state.active.items
            : state.templates[current()].map((name) => ({
                name,
                sets: [
                  { weight: "", reps: "", done: false },
                  { weight: "", reps: "", done: false },
                  { weight: "", reps: "", done: false },
                ],
              }))
          )
            .map(
              (x, i) =>
                `<details class="card exercise" ${i === 0 ? "open" : ""}><summary>${i + 1}. ${esc(x.name)}</summary><div class="exercise-body">${active ? setsUI(x, i) : '<div class="muted">План · 3 рабочих подхода</div>'}</div></details>`,
            )
            .join("")}`;
        else if (tab === "План")
          body = `<div class="card"><h3 class="sectiontitle">Тренировочный цикл</h3><div class="cycle">${state.cycle.map((d, i) => `<button class="day" onclick="moveDay(${i})">${i + 1}. ${esc(d)} ↕</button>`).join("")}</div><p class="muted">Нажми день, чтобы переместить его в конец цикла.</p></div>${Object.entries(
            state.templates,
          )
            .map(
              ([d, xs]) =>
                `<div class="card"><div class="row"><h3 class="sectiontitle">${esc(d)}</h3><span class="badge">${xs.length} упражнений</span></div><div class="exercise-list">${xs.map((x, i) => `<div class="listrow"><span>${i + 1}. ${esc(x)}</span><span class="muted">3 подхода</span></div>`).join("")}</div></div>`,
            )
            .join("")}`;
        else if (tab === "Прогресс") {
          const maxes = {};
          state.sessions.forEach((s) =>
            s.items.forEach((x) =>
              x.sets
                .filter((y) => y.done && +y.weight > 0)
                .forEach(
                  (y) =>
                    (maxes[x.name] = Math.max(maxes[x.name] || 0, +y.weight)),
                ),
            ),
          );
          const values = Object.entries(maxes).slice(0, 8);
          body = `<div class="card"><h3 class="sectiontitle">Рабочие веса · личный рекорд</h3>${values.length ? `<div class="exercise-list">${values.map(([n, v]) => `<div class="listrow"><span>${esc(n)}</span><b>${v} кг</b></div>`).join("")}</div>` : '<div class="empty">Заверши подходы с весом — здесь появятся рекорды</div>'}</div><div class="card"><h3 class="sectiontitle">Объём тренировок</h3><div class="stats">${
            state.sessions
              .slice(0, 3)
              .map(
                (s) =>
                  `<div class="stat">${new Date(s.date).toLocaleDateString("ru-RU")}<b>${volume(s).toLocaleString("ru-RU")} кг</b></div>`,
              )
              .join("") || '<div class="muted">Пока нет данных</div>'
          }</div></div>`;
        } else
          body = `<div class="card"><h3 class="sectiontitle">История тренировок</h3>${state.sessions.length ? `<div class="exercise-list">${state.sessions.map((s) => `<div class="listrow"><div><b>${esc(s.name)}</b><div class="muted">${new Date(s.date).toLocaleString("ru-RU")} · ${s.items.length} упражнений</div></div><div style="text-align:right"><b>${volume(s).toLocaleString("ru-RU")} кг</b><div class="muted">объём</div></div></div>`).join("")}</div>` : '<div class="empty">История появится после завершения тренировки</div>'}</div>`;
        document.querySelector("#app").innerHTML =
          `<section class="device"><div class="statusbar"><span>9:41</span><span class="status-icons">◆ ◉ ▮ 100%</span></div><header class="top"><div class="brand">✦ Rep<i>Track</i></div><div class="topright"><span class="pill">● Только на этом устройстве</span><button class="iconbtn" onclick="exportData()" title="Экспорт данных">⇧</button><button class="iconbtn" onclick="importData()" title="Импорт данных">⚙</button></div></header><div class="layout"><nav class="nav"><small>Тренировки</small>${[
            ["Главная", "⌂"],
            ["Зал", "♧"],
            ["План", "▦"],
            ["Прогресс", "↗"],
            ["История", "◷"],
          ]
            .map(
              ([n, i]) =>
                `<button class="${tab === n ? "active" : ""}" onclick="go('${n}')"><span>${i}</span> ${n}</button>`,
            )
            .join(
              "",
            )}<small>Данные сохраняются автоматически</small></nav><main class="content"><h1 class="heading">${tab === "Главная" ? "Твой прогресс. Твой план." : tab}</h1><p class="sub">${tab === "Главная" ? "Сильнее с каждой тренировкой" : "Локально сохранено на этом устройстве"}</p>${body}<p class="foot">RepTrack · Purple Pro · Данные хранятся в этом браузере</p></main></div><div class="android-home"></div></section>`;
      }
      function volume(s) {
        return s.items.reduce(
          (n, x) =>
            n +
            x.sets
              .filter((y) => y.done)
              .reduce((m, y) => m + (+y.weight || 0) * (+y.reps || 0), 0),
          0,
        );
      }
      function go(t) {
        state.tab = t;
        render();
      }
      function edit(i, j, k, v) {
        state.active.items[i].sets[j][k] = v;
        save();
      }
      function toggle(i, j) {
        const s = state.active.items[i].sets[j];
        s.done = !s.done;
        save();
        render();
      }
      function addSet(i) {
        state.active.items[i].sets.push({ weight: "", reps: "", done: false });
        save();
        render();
      }
      function moveDay(i) {
        state.cycle.push(...state.cycle.splice(i, 1));
        save();
        render();
      }
      function exportData() {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob([JSON.stringify(state, null, 2)], {
            type: "application/json",
          }),
        );
        a.download = "reptrack-export.json";
        a.click();
        URL.revokeObjectURL(a.href);
      }
      function importData() {
        const f = document.createElement("input");
        f.type = "file";
        f.accept = ".json,application/json";
        f.onchange = async () => {
          try {
            const d = JSON.parse(await f.files[0].text());
            if (
              !Array.isArray(d.cycle) ||
              !d.templates ||
              !Array.isArray(d.sessions)
            )
              throw Error();
            state = d;
            save();
            render();
          } catch {
            alert("Не удалось прочитать файл RepTrack");
          }
        };
        f.click();
      }
      render();
      setInterval(() => {
        if (state.active && state.tab === "Зал") render();
      }, 60000);
    </script>
    <script>
      (() => {
        const now = new Date();
        const forceDemo =
          new URLSearchParams(location.search).get("demo") === "1";
        const hasDemo = state.sessions.some((session) => session.demo);
        if (
          !state.active &&
          !hasDemo &&
          (!state.sessions.length || forceDemo)
        ) {
          const demo = Array.from({ length: 12 }, (_, index) => {
            const age = 29 - Math.round((index * 29) / 11);
            const date = new Date(now);
            date.setDate(date.getDate() - age);
            if (age) date.setHours(18, 0, 0, 0);
            const name = initial.cycle[index % initial.cycle.length];
            const items = state.templates[name]
              .slice(0, 5)
              .map((exercise, exerciseIndex) => ({
                name: exercise,
                sets: Array.from({ length: 3 }, (_, setIndex) => ({
                  weight: String(
                    15 +
                      exerciseIndex * 10 +
                      Math.floor(index / 4) * 2.5 +
                      setIndex * 2.5,
                  ),
                  reps: String(12 - setIndex * 2),
                  done: true,
                })),
              }));
            return {
              name,
              started: date.getTime() - 3600000,
              ended: date.getTime(),
              date: date.toISOString(),
              demo: true,
              items,
            };
          });
          state.sessions = [...demo, ...state.sessions].sort(
            (a, b) => new Date(b.date) - new Date(a.date),
          );
          state.tab = "Прогресс";
          save();
        }

        document.head.insertAdjacentHTML(
          "beforeend",
          `<style>
    .monthchart{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;height:132px;align-items:end;margin:14px 0 4px}
    .monthweek{display:grid;grid-template-rows:1fr auto;gap:7px;height:100%;min-width:0;text-align:center;color:var(--muted);font-size:10px}
    .monthbartrack{height:100%;display:flex;align-items:end}
    .monthbar{width:100%;min-height:5px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,#c398ff,#8054dd)}
    .monthvolume{color:var(--text);font-size:9px;line-height:1.2}
  </style>`,
        );

        const renderScreen = render;
        render = function () {
          renderScreen();
          if (state.tab !== "Прогресс") return;
          const today = new Date();
          const rangeStart = new Date(today);
          rangeStart.setDate(rangeStart.getDate() - 29);
          rangeStart.setHours(0, 0, 0, 0);
          const month = state.sessions.filter((session) => {
            const date = new Date(session.date).getTime();
            return date >= rangeStart.getTime() && date <= today.getTime();
          });
          const weeks = Array.from({ length: 5 }, () => ({
            sessions: 0,
            volume: 0,
          }));
          month.forEach((session) => {
            const age = Math.floor(
              (today.getTime() - new Date(session.date).getTime()) / 86400000,
            );
            const week = Math.min(4, Math.floor((29 - age) / 7));
            weeks[week].sessions++;
            weeks[week].volume += volume(session);
          });
          const maxVolume = Math.max(1, ...weeks.map((week) => week.volume));
          const totalSets = month.reduce(
            (sum, session) =>
              sum +
              session.items.reduce(
                (count, item) =>
                  count + item.sets.filter((set) => set.done).length,
                0,
              ),
            0,
          );
          const totalVolume = month.reduce(
            (sum, session) => sum + volume(session),
            0,
          );
          const dateText = `${rangeStart.toLocaleDateString("ru-RU", { day: "numeric", month: "short" })} — ${today.toLocaleDateString("ru-RU", { day: "numeric", month: "short" })}`;
          const demoCount = month.filter((session) => session.demo).length;
          const weeksHtml = weeks
            .map((week, index) => {
              const start = new Date(rangeStart);
              start.setDate(start.getDate() + index * 7);
              return `<div class="monthweek"><div class="monthbartrack"><div class="monthbar" style="height:${Math.max(4, (week.volume / maxVolume) * 100)}%" title="${week.sessions} тренировок · ${week.volume.toLocaleString("ru-RU")} кг"></div></div><div><div class="monthvolume">${week.sessions ? `${week.sessions} тр.` : "—"}</div><div>${start.toLocaleDateString("ru-RU", { day: "numeric", month: "short" })}</div></div></div>`;
            })
            .join("");
          const panel = document.createElement("section");
          panel.className = "card";
          panel.innerHTML = `<div class="row"><h3 class="sectiontitle">Последние 30 дней</h3><span class="badge">${dateText}</span></div><div class="stats"><div class="stat">Тренировок<b>${month.length}</b></div><div class="stat">Подходов<b>${totalSets}</b></div><div class="stat">Тоннаж<b>${totalVolume.toLocaleString("ru-RU")} кг</b></div></div><div class="monthchart">${weeksHtml}</div><p class="muted" style="font-size:12px;margin:10px 0 0">${demoCount ? `Шаблонные данные для тестирования · ${demoCount} тренировок` : "Показаны ваши тренировки за месяц"}</p>`;
          document
            .querySelector(".content .sub")
            .insertAdjacentElement("afterend", panel);
        };
        render();
      })();
    </script>
  </body>
</html>
